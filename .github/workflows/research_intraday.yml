name: Research Intraday (5-min bars for weekly picks)

# Manual only. Adds intraday_5m_<year>.parquet to the research-data branch.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Debug: only the last N weeks (0 = all)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install "alpaca-py>=0.30.0" "pandas>=2.0" pyarrow

      - name: Load research-data branch
        run: git clone -q --depth 1 -b research-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research_data

      - name: Fetch 5-minute bars
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          RESEARCH_DATA: research_data
          LIMIT: ${{ inputs.limit }}
        run: python research/fetch_intraday.py

      - name: Push to research-data branch
        run: |
          cd research_data
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "research intraday $(date -u +%Y-%m-%dT%H:%MZ)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:research-data
