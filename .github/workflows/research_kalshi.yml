name: Research Kalshi (weather markets + forecasts)

# Manual only. Adds research_data/kalshi/* to the research-data branch.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma list: markets,candles,mos'
        required: false
        default: 'markets,candles,mos'
      series:
        description: 'Comma list of series tickers (blank = all known US daily-high series)'
        required: false
        default: ''
      start:
        description: 'Earliest market open date for candles / MOS'
        required: false
        default: '2021-06-01'

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install "pandas>=2.0" pyarrow

      - name: Load research-data branch
        run: git clone -q --depth 1 -b research-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research_data

      - name: Fetch
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RESEARCH_DATA: research_data
          ONLY: ${{ inputs.only }}
          SERIES: ${{ inputs.series }}
          START: ${{ inputs.start }}
        run: python research/kalshi/fetch_kalshi.py

      - name: Push to research-data branch
        if: always()
        run: |
          cd research_data
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "research kalshi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:research-data
