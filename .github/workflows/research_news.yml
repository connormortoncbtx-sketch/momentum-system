name: Research News (Claude labels earnings news)

# Manual only. Labels the pre-registered event sample in research/news_sample.csv
# and adds news_labels.parquet to the research-data branch. Hard spend cap.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Debug: events per split (0 = full sample)'
        required: false
        default: '0'
      model:
        description: 'claude-sonnet-5-5 or claude-opus-5-5'
        required: false
        default: 'claude-sonnet-5-5'
      budget:
        description: 'Hard spend cap in USD'
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install "anthropic>=0.60" "pandas>=2.0" pyarrow

      - name: Load research-data branch
        run: git clone -q --depth 1 -b research-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research_data

      - name: Label news
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_DATA: research_data
          LIMIT: ${{ inputs.limit }}
          NEWS_MODEL: ${{ inputs.model }}
          BUDGET_USD: ${{ inputs.budget }}
        run: python research/news_classify.py

      - name: Push to research-data branch
        run: |
          cd research_data
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "research news labels $(date -u +%Y-%m-%dT%H:%MZ)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:research-data
