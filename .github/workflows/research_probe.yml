name: Research probe (run a research/probes script)

# Manual only. Runs research/probes/<script>.py with secrets for data APIs and
# reports via ::notice:: annotations (job logs are not readable from the
# research session). Never places orders.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script name in research/probes (without .py)'
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "pandas>=2.0" pyarrow alpaca-py
      - name: Run probe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python "research/probes/${{ inputs.script }}.py"
