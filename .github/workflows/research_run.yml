name: Research run (research/<script>.py -> research-data branch)

# Manual only. Runs a research script with data-API secrets and pushes anything it
# writes under research_data/ to the research-data branch. Never places orders.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script name in research/ (without .py)'
        required: true
      limit:
        description: 'Optional LIMIT env for a smoke test'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: research-run-${{ inputs.script }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "pandas>=2.0" pyarrow alpaca-py anthropic scipy
      - name: Load research-data branch
        run: git clone -q --depth 1 -b research-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research_data
      - name: Run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          RESEARCH_DATA: research_data
          LIMIT: ${{ inputs.limit }}
        run: python "research/${{ inputs.script }}.py"
      - name: Push to research-data branch
        if: always()
        run: |
          cd research_data
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "research ${{ inputs.script }} $(date -u +%Y-%m-%dT%H:%MZ)"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # several research runs may push to the branch at once: on rejection, re-clone
          # the latest branch, lay our changed files over it and retry
          for attempt in 1 2 3 4 5; do
            git push -q "$URL" HEAD:research-data && exit 0
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            cd .. && rm -rf rd_new && git clone -q --depth 1 -b research-data "$URL" rd_new
            for f in $CHANGED; do mkdir -p "rd_new/$(dirname "$f")"; cp "research_data/$f" "rd_new/$f"; done
            rm -rf research_data && mv rd_new research_data && cd research_data
            git config user.name "momentum-bot"; git config user.email "momentum-bot@users.noreply.github.com"
            git add -A; git commit -q -m "research ${{ inputs.script }} $(date -u +%Y-%m-%dT%H:%MZ) (retry $attempt)"
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
