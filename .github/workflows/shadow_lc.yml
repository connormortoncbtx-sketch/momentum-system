name: Shadow Portfolios (no orders)

# Side-by-side shadows (no orders): #1 large-cap monthly momentum, #2 contrarian
# regime switch, #3 macro + volatility-sized momentum exposure, #4 slow 12-1
# momentum held while in the top 100 (spike-filtered), #5 live picks with vs
# without the earnings-week exclusion. Uses the
# entry day's official close fetched after the fact, so GitHub cron drift is
# harmless; the script is idempotent per entry date (extra runs are no-ops).
on:
  schedule:
    - cron: '30 23 * * 1'   # Monday evening (any lateness is fine)
    - cron: '30 23 * * 2'   # Tuesday: covers Monday-holiday weeks + Monday misses
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-lc
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NTFY_CHANNEL: ${{ secrets.NTFY_CHANNEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update shadow portfolio
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || 'true' }}
        run: python automation/shadow_lc_momentum.py

      - name: Update shadow regime switch
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || 'true' }}
        run: |
          pip install pyarrow
          python automation/shadow_regime_switch.py

      - name: Update shadow macro-sized momentum
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || 'true' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python automation/shadow_macro_sized.py

      - name: Update shadow slow momentum (12-1, hold while top 100)
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || 'true' }}
        run: python automation/shadow_slow_momentum.py

      - name: Update shadow earnings-hold comparison
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || 'true' }}
        run: python automation/shadow_earnings_hold.py

      - name: Commit ledger
        run: |
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add data/shadow_lc_state.json data/shadow_lc_ledger.jsonl data/shadow_regime_state.json data/shadow_regime_ledger.jsonl data/shadow_macro_state.json data/shadow_macro_ledger.jsonl data/shadow_slow_state.json data/shadow_slow_ledger.jsonl data/shadow_earnings_state.json data/shadow_earnings_ledger.jsonl data/system_log.jsonl 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "shadows: $(date +%Y-%m-%d) update"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            git pull origin main --no-rebase --strategy=recursive -X theirs --no-edit 2>/dev/null || true
            [ $attempt -eq 5 ] && exit 1
            sleep $((RANDOM % 5 + 2))
          done
