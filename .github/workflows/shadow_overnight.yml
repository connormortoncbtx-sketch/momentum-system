name: Shadow Overnight (#8, no orders)

# Marks overnight-only momentum each trading morning: last close -> today's open for the
# LIVE-proxy top 10 (official prints after the fact; idempotent, catches up missed nights).
on:
  schedule:
    - cron: '20 15 * * 1-5'   # 11:20 ET weekdays (opens final, bars published)
    - cron: '20 22 * * 1-5'   # 18:20 ET backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-overnight
  cancel-in-progress: false

jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update shadow overnight
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: pip install pyarrow && python automation/shadow_overnight.py
      - name: Commit ledger
        run: |
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          for f in data/shadow_overnight_state.json data/shadow_overnight_ledger.jsonl data/system_log.jsonl; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -q -m "shadow overnight: $(date +%Y-%m-%d) update"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            git pull origin main --no-rebase --strategy=recursive -X theirs --no-edit 2>/dev/null || true
            [ $attempt -eq 5 ] && exit 1
            sleep $((RANDOM % 5 + 2))
          done
