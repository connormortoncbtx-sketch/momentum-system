name: Theta run (ThetaData terminal + research/<script>.py -> research-data branch)

# Manual only. Runs a research script with data-API secrets and pushes anything it
# writes under research_data/ to the research-data branch. Never places orders.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script name in research/ (without .py)'
        required: true
      limit:
        description: 'Optional LIMIT env for a smoke test'
        required: false
        default: ''
      mode:
        description: 'Optional MODE env (probe = API format check only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: theta-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "pandas>=2.0" pyarrow alpaca-py anthropic scipy requests
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Start Theta Terminal (v3)
        env:
          THETA_USER: ${{ secrets.THETADATA_USERNAME }}
          THETA_PASS: ${{ secrets.THETADATA_PASSWORD }}
        run: |
          if [ -z "$THETA_USER" ]; then echo "::error::THETADATA_USERNAME secret missing"; exit 1; fi
          mkdir -p theta && cd theta
          for u in https://download-stable.thetadata.us/ThetaTerminalv3.jar https://download-unstable.thetadata.us/ThetaTerminalv3.jar \
                   https://download.thetadata.net/ThetaTerminalv3.jar https://thetadata.net/ThetaTerminalv3.jar; do
            if curl -fsSL -o ThetaTerminalv3.jar "$u" && unzip -tq ThetaTerminalv3.jar >/dev/null 2>&1; then echo "::notice::jar from $u ($(stat -c%s ThetaTerminalv3.jar) bytes)"; break; fi
            rm -f ThetaTerminalv3.jar
          done
          [ -f ThetaTerminalv3.jar ] || { echo "::error::could not download ThetaTerminalv3.jar from any known URL"; exit 1; }
          printf '%s\n%s\n' "$THETA_USER" "$THETA_PASS" > creds.txt && chmod 600 creds.txt
          nohup java -Xmx2g -jar ThetaTerminalv3.jar --creds-file creds.txt > terminal.log 2>&1 &
          up=0
          for i in $(seq 1 150); do
            for port in 25503 25510 25520 25511; do
              code=$(curl -s -o /tmp/theta_probe -w '%{http_code}' "http://127.0.0.1:$port/v3/option/list/expirations?symbol=SPY&format=json" || true)
              if [ "$code" = "200" ] || [ "$code" = "472" ]; then up=1; echo "THETA_URL=http://127.0.0.1:$port/v3" >> "$GITHUB_ENV"; echo "THETA_API=v3" >> "$GITHUB_ENV"
                echo "::notice::terminal REST (v3) up on port $port after $((i*2))s"; break 2; fi
              code=$(curl -s -o /tmp/theta_probe -w '%{http_code}' "http://127.0.0.1:$port/v2/list/expirations?root=SPY" || true)
              if [ "$code" = "200" ]; then up=1; echo "THETA_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"; echo "THETA_API=v2" >> "$GITHUB_ENV"
                echo "::notice::terminal REST (v2) up on port $port after $((i*2))s: $(head -c 300 /tmp/theta_probe)"; break 2; fi
            done
            if ! kill -0 $! 2>/dev/null; then echo "::warning::terminal process exited"; break; fi
            sleep 2
          done
          echo "::notice::terminal log: $(tail -n 12 terminal.log | sed 's/[[:cntrl:]]//g; s/\[[0-9;]*m//g' | grep -v -i password | tr '\n' '|' | cut -c1-1500)"
          echo "::notice::config: $(grep -iE 'port|http|rest' $HOME/ThetaData/ThetaTerminal/config_0.properties 2>/dev/null | tr '\n' '|' | cut -c1-800)"
          echo "::notice::listening: $(ss -ltnp 2>/dev/null | grep java | awk '{print $4}' | tr '\n' ' ')"
          [ $up = 1 ] || { echo "::error::Theta Terminal REST not reachable"; exit 1; }
      - name: Restore raw ThetaData cache (private Actions cache; never pushed)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/theta_raw
          key: theta-raw-v1-${{ github.run_id }}
          restore-keys: theta-raw-v1-
      - name: Load research-data branch
        run: git clone -q --depth 1 -b research-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research_data
      - name: Run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          RESEARCH_DATA: research_data
          LIMIT: ${{ inputs.limit }}
          MODE: ${{ inputs.mode }}
          RAW_DIR: ${{ runner.temp }}/theta_raw
        run: python "research/${{ inputs.script }}.py"
      - name: Save raw ThetaData cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/theta_raw
          key: theta-raw-v1-${{ github.run_id }}
      - name: Push to research-data branch
        if: always()
        run: |
          cd research_data
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "research ${{ inputs.script }} $(date -u +%Y-%m-%dT%H:%MZ)"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # several research runs may push to the branch at once: on rejection, re-clone
          # the latest branch, lay our changed files over it and retry
          for attempt in 1 2 3 4 5; do
            git push -q "$URL" HEAD:research-data && exit 0
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            cd .. && rm -rf rd_new && git clone -q --depth 1 -b research-data "$URL" rd_new
            for f in $CHANGED; do mkdir -p "rd_new/$(dirname "$f")"; cp "research_data/$f" "rd_new/$f"; done
            rm -rf research_data && mv rd_new research_data && cd research_data
            git config user.name "momentum-bot"; git config user.email "momentum-bot@users.noreply.github.com"
            git add -A; git commit -q -m "research ${{ inputs.script }} $(date -u +%Y-%m-%dT%H:%MZ) (retry $attempt)"
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
